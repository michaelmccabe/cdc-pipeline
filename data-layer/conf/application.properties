# Sink to Redis Streams
debezium.sink.type=redis
debezium.sink.redis.address=redis:6379
debezium.sink.redis.type=transactional
debezium.sink.redis.message.format=compact
debezium.sink.redis.batch.size=10
debezium.sink.redis.stream.topic=cdc-server

# Source: Postgres (use include.list for v2.5+)
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=1000

# Internal Kafka-like Config (required for embedded engine)
debezium.source.topic.prefix=cdc-server

# Postgres connection
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=postgres
debezium.source.database.password=postgres
debezium.source.database.dbname=postgres
debezium.source.database.server.name=cdc-server

# Capture specific schema/table
debezium.source.schema.include.list=test_schema
debezium.source.table.include.list=test_schema.employee
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=debezium_slot

# Snapshot & heartbeats
debezium.source.snapshot.mode=initial
debezium.source.heartbeat.interval.ms=10000
debezium.source.heartbeat.topics.prefix=heartbeat

# Increase logging for Redis sink to debug to surface write attempts/failures
# Quarkus logging categories - will be picked up when the container restarts
quarkus.log.category."io.debezium.server.redis".level=DEBUG
quarkus.log.category."io.debezium.storage.redis".level=DEBUG
quarkus.log.category."io.debezium.server".level=DEBUG
quarkus.log.category."io.debezium.server.BaseChangeConsumer".level=DEBUG
quarkus.log.category."io.debezium.server.redis.RedisStreamChangeConsumer".level=DEBUG