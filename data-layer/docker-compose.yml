version: '3.1'

services:
  redis:
    image: redis:7-alpine  # Latest stable
    ports:
      - 6379:6379
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./postgresql.conf:/etc/postgresql/postgresql.conf
      - ./init:/docker-entrypoint-initdb.d
    command:
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  debezium:
    image: quay.io/debezium/server:2.5  # Latest as of Oct 2025
    volumes:
      - ./conf:/debezium/conf
      - ./data:/debezium/data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 8083:8083  # Optional: Debezium metrics